<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="620.0" y="28" font-size="24" text-anchor="middle">TCP Load Balancer — system architecture</text><rect x="260" y="50" width="690" height="410" fill="white" stroke="#222" stroke-dasharray="6 5"/><text x="605.0" y="260.95" font-size="17" text-anchor="middle"></text><text x="600" y="76" font-size="16" text-anchor="middle">C++17 process · one nonblocking poll reactor</text><rect x="300" y="100" width="200" height="65" fill="white" stroke="#222"/><text x="400.0" y="138.45" font-size="17" text-anchor="middle">Public listener</text><rect x="650" y="100" width="260" height="65" fill="white" stroke="#222"/><text x="780.0" y="127.75" font-size="15" text-anchor="middle">Healthy backend selector</text><text x="780.0" y="147.75" font-size="15" text-anchor="middle">Least connections / Round robin</text><rect x="40" y="225" width="160" height="80" fill="white" stroke="#222"/><text x="120.0" y="270.95" font-size="17" text-anchor="middle">TCP clients</text><rect x="480" y="225" width="240" height="80" fill="white" stroke="#222"/><text x="600.0" y="259.95" font-size="17" text-anchor="middle">Per-connection tunnel</text><text x="600.0" y="281.95" font-size="17" text-anchor="middle">Client + upstream sockets</text><rect x="1020" y="225" width="180" height="80" fill="white" stroke="#222"/><text x="1110.0" y="259.95" font-size="17" text-anchor="middle">Backend pool</text><text x="1110.0" y="281.95" font-size="17" text-anchor="middle">A / B / ...</text><polyline points="200,265 480,265" fill="none" stroke="#222" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="340" y="250" font-size="15" text-anchor="middle">TCP bytes</text><polyline points="720,265 1020,265" fill="none" stroke="#222" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="870" y="250" font-size="15" text-anchor="middle">One selected backend</text><polyline points="500,132 650,132" fill="none" stroke="#222" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="575" y="121" font-size="14" text-anchor="middle">accept</text><polyline points="780,165 780,195 600,195 600,225" fill="none" stroke="#222" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="290" y="365" width="170" height="65" fill="white" stroke="#222"/><text x="375.0" y="392.75" font-size="15" text-anchor="middle">Loopback admin</text><text x="375.0" y="412.75" font-size="15" text-anchor="middle">/metrics · /ready</text><rect x="500" y="365" width="200" height="65" fill="white" stroke="#222"/><text x="600.0" y="403.45" font-size="17" text-anchor="middle">poll event loop</text><rect x="750" y="365" width="170" height="65" fill="white" stroke="#222"/><text x="835.0" y="402.75" font-size="15" text-anchor="middle">TCP health probes</text><rect x="40" y="365" width="160" height="65" fill="white" stroke="#222"/><text x="120.0" y="402.75" font-size="15" text-anchor="middle">Local operator</text><polyline points="200,397 290,397" fill="none" stroke="#222" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 5"/><polyline points="460,397 500,397" fill="none" stroke="#222" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 5"/><polyline points="600,365 600,305" fill="none" stroke="#222" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="700,397 750,397" fill="none" stroke="#222" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 5"/><polyline points="920,397 1110,397 1110,305" fill="none" stroke="#222" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="835,365 935,365 935,132 910,132" fill="none" stroke="#222" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="620" y="490" font-size="16" text-anchor="middle">Solid: TCP data    |    Dashed: accept, health and reactor control    |    Routing is per connection</text></g></svg>
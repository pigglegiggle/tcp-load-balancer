<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">TCP forwarding — two independent directions</text><rect x="35" y="120" width="190" height="230" fill="white" stroke="#222"/><text x="130.0" y="240.95" font-size="17" text-anchor="middle">Client socket</text><rect x="975" y="120" width="190" height="230" fill="white" stroke="#222"/><text x="1070.0" y="240.95" font-size="17" text-anchor="middle">Backend socket</text><rect x="450" y="130" width="300" height="75" fill="white" stroke="#222"/><text x="600.0" y="162.45" font-size="17" text-anchor="middle">to_backend ring buffer</text><text x="600.0" y="184.45" font-size="17" text-anchor="middle">64 KiB default</text><rect x="450" y="265" width="300" height="75" fill="white" stroke="#222"/><text x="600.0" y="297.45" font-size="17" text-anchor="middle">to_client ring buffer</text><text x="600.0" y="319.45" font-size="17" text-anchor="middle">64 KiB default</text><polyline points="225,167 450,167" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="338" y="151" font-size="16" text-anchor="middle">recv(client)</text><polyline points="750,167 975,167" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="863" y="151" font-size="16" text-anchor="middle">send(backend)</text><polyline points="975,302 750,302" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="863" y="286" font-size="16" text-anchor="middle">recv(backend)</text><polyline points="450,302 225,302" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="338" y="286" font-size="16" text-anchor="middle">send(client)</text><text x="600" y="405" font-size="18" text-anchor="middle">Full ring → pause source reads. Partial send → keep remaining bytes.</text><text x="600" y="440" font-size="18" text-anchor="middle">EOF → drain that ring → shutdown(destination, SHUT_WR).</text><text x="600" y="475" font-size="17" text-anchor="middle">The opposite direction stays open until its own EOF or failure.</text></g></svg>
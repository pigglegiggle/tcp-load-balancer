<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">Backend selection — indexed heap and health</text><rect x="30" y="70" width="550" height="400" fill="white" stroke="#222" stroke-dasharray="6 5"/><text x="305.0" y="275.95" font-size="17" text-anchor="middle"></text><rect x="620" y="70" width="550" height="400" fill="white" stroke="#222" stroke-dasharray="6 5"/><text x="895.0" y="275.95" font-size="17" text-anchor="middle"></text><text x="305" y="100" font-size="19" text-anchor="middle">Least-connections index (example)</text><rect x="215" y="135" width="180" height="60" fill="white" stroke="#222"/><text x="305.0" y="170.95" font-size="17" text-anchor="middle">B: 1 active</text><rect x="65" y="250" width="180" height="60" fill="white" stroke="#222"/><text x="155.0" y="285.95" font-size="17" text-anchor="middle">A: 2 active</text><rect x="365" y="250" width="180" height="60" fill="white" stroke="#222"/><text x="455.0" y="285.95" font-size="17" text-anchor="middle">C: 3 active</text><polyline points="265,195 155,250" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="345,195 455,250" fill="none" stroke="#222" marker-end="url(#arrow)"/><rect x="100" y="345" width="410" height="50" fill="white" stroke="#222"/><text x="305.0" y="375.95" font-size="17" text-anchor="middle">Dense ID → heap-position vector</text><text x="305" y="428" font-size="18" text-anchor="middle">Acquire / release: O(log B)</text><text x="305" y="453" font-size="15" text-anchor="middle">Equal load: least recently selected first</text><text x="895" y="100" font-size="19" text-anchor="middle">TCP probe eligibility</text><rect x="650" y="205" width="180" height="75" fill="white" stroke="#222"/><text x="740.0" y="248.45" font-size="17" text-anchor="middle">Unhealthy</text><rect x="960" y="205" width="180" height="75" fill="white" stroke="#222"/><text x="1050.0" y="248.45" font-size="17" text-anchor="middle">Healthy</text><polyline points="740,205 740,145 1050,145 1050,205" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="895" y="132" font-size="15" text-anchor="middle">rise consecutive successful probes</text><polyline points="1050,280 1050,330 740,330 740,280" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="895" y="355" font-size="15" text-anchor="middle">fall consecutive failed probes</text><text x="895" y="413" font-size="15" text-anchor="middle">Passive connect failure: immediate exclusion</text><text x="895" y="443" font-size="15" text-anchor="middle">Startup: ineligible until rise threshold passes</text><text x="600" y="510" font-size="18" text-anchor="middle">Select only healthy backends. Existing streams keep their assigned backend.</text><text x="600" y="545" font-size="17" text-anchor="middle">Health means TCP reachability, not application correctness.</text></g></svg>